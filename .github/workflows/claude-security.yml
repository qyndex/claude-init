name: Claude Security Review

# Exact-head ordinary source review using pinned Sonnet 5.5 and subscription OAuth.
# Tool-free, bounded stdin; structured artifacts are not protected factory receipts.
# No Claude GitHub App integration, API fallback or comment posting.

on:
  pull_request:
    # Security evidence must cover the updated candidate head.
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  security-review:
    # Skip drafts, and skip Dependabot PRs (T-155): GitHub runs dependabot-
    # triggered workflows in a restricted context that does NOT expose regular
    # org/repo Actions secrets, so the Anthropic credential is never present and
    # this gating job could only ever hard-fail. Dependency-only PRs change no
    # application code — semgrep, codeql, and dependency-review still cover them.
    # A skipped required check is treated as passing, so this unblocks the PR.
    # release-fast-pass: a bot-authored release-please PR changes only
    # version/changelog files (verified by release-please.yml before it arms
    # auto-merge) — skip; GitHub counts a skipped required check as satisfied.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false && github.actor != 'dependabot[bot]' &&
      !(startsWith(github.head_ref, 'release-please--') &&
        github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact-head review context and validator
        id: prepare_review
        run: |
          mkdir "$RUNNER_TEMP/ordinary-review-runtime"
          cp .claude/scripts/run-claude-review.py .claude/scripts/retain-claude-review.py .claude/scripts/factory-bounded-process.py "$RUNNER_TEMP/ordinary-review-runtime/"
          python3 -I .claude/scripts/prepare-claude-review.py

      - name: Set up pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install pinned subscription reviewer
        id: install_review
        run: npm install --prefix "$RUNNER_TEMP/ordinary-review-cli" @anthropic-ai/claude-code@2.1.295

      - name: Run and retain bounded tool-free review
        id: claude_review
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_PREPARE_OUTCOME: ${{ steps.prepare_review.outcome }}
          REVIEW_INSTALL_OUTCOME: ${{ steps.install_review.outcome }}
        run: |
          if [ ! -f "$RUNNER_TEMP/ordinary-review-runtime/run-claude-review.py" ]; then
            mkdir "$RUNNER_TEMP/retained-security-review"
            printf '%s\n' '{"schema_version":1,"role":"security","status":"blocked","reason":"runtime-unavailable"}' > "$RUNNER_TEMP/retained-security-review/review.json"
            exit 1
          fi
          if REVIEW_NODE="$(command -v node)"; then :; else REVIEW_NODE=""; fi
          REVIEW_EXECUTABLE="$RUNNER_TEMP/ordinary-review-cli/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs"
          export REVIEW_NODE REVIEW_EXECUTABLE
          python3 -I "$RUNNER_TEMP/ordinary-review-runtime/run-claude-review.py" --role security --output "$RUNNER_TEMP/retained-security-review"

      - name: Preserve security review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: claude-security-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-security-review/review.json
          if-no-files-found: error
          retention-days: 90

      - name: Gitleaks (CLI — no org licence; T-143)
        if: always()
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          cfg=""; [ -f .gitleaks.toml ] && cfg="--config .gitleaks.toml"
          # shellcheck disable=SC2086 # cfg is a controlled two-token flag or empty; intentional word-split
          # Scan all candidate-reachable source history; reporting state refs are separate data.
          /tmp/gitleaks git --redact --exit-code 1 --log-opts "--full-history HEAD" $cfg

      # dependency-review needs Dependency Graph (+ GHAS on private repos) — advisory
      # where the capability is absent (T-144); gitleaks + the LLM scan still gate.
      - name: Dependency review (advisory where Dependency Graph/GHAS is off; T-144)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  manual-security-scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (CLI — no org licence; T-143)
        if: always()
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          cfg=""; [ -f .gitleaks.toml ] && cfg="--config .gitleaks.toml"
          # shellcheck disable=SC2086 # cfg is a controlled two-token flag or empty; intentional word-split
          # Scan all candidate-reachable source history; reporting state refs are separate data.
          /tmp/gitleaks git --redact --exit-code 1 --log-opts "--full-history HEAD" $cfg
