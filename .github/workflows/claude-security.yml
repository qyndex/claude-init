name: Claude Security Review

# Anthropic's claude-code-security-review action. Multi-agent parallel security
# audit on every PR. Re-verifies each finding to filter false positives.
# https://github.com/anthropics/claude-code-security-review
#
# IMPORTANT: pinned to a tagged release (not @main) per the Round 3 security
# audit M-S3 finding. If Anthropic publishes a new tag, bump it here with
# Renovate/Dependabot rather than auto-tracking main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Anthropic security review
        # Pinned tag — bump via Renovate/Dependabot. Do NOT use @main.
        # If a stable tag isn't published yet, pin to a commit SHA:
        #   uses: anthropics/claude-code-security-review@<40-char SHA>
        uses: anthropics/claude-code-security-review@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-7

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
