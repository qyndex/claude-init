name: Claude Security Review

# Security audit on every PR — runs as a claude-code-action@v1 prompt so it
# authenticates with the Claude subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN),
# NOT a metered ANTHROPIC_API_KEY. This is the "OAuth everywhere" rework
# (T-153): the previous design used anthropics/claude-code-security-review, which
# has no OAuth input and runs Opus on every push — that combination cost ~$40 of
# metered API in a single iterative session. OAuth = subscription = no per-call
# metered spend.
#
# Tradeoff (recorded so it isn't lost): the dedicated scanner did diff-aware
# finding dedup + SARIF/code-scanning annotations. The prompt approach is the
# `security` agent told to audit the diff — structure is enforced by the prompt's
# format contract + the format-lint step, not by the action. gitleaks (secrets) +
# dependency-review (CVEs) remain UNCONDITIONAL hard gates on every push, so the
# secret/dependency axes are never weakened by this swap.
#
# COST CONTROLS (T-153):
#   - OAuth token, not API key → no metered spend.
#   - Triggers on opened/ready_for_review/reopened ONLY — NOT synchronize, so a
#     push storm on an open PR does not re-run the LLM scan on every commit.
#   - Sonnet 4.6, not Opus — adequate for diff-scoped SAST, far cheaper if a key
#     is ever used as a fallback.
#   - concurrency cancels superseded runs.

on:
  pull_request:
    # NOT synchronize — one LLM security pass when a PR opens / is marked ready,
    # not on every push (that was the per-push cost driver).
    types: [opened, ready_for_review, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write # OIDC -> Claude GitHub App token exchange (OAuth path)

concurrency:
  group: claude-security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  security-review:
    # Skip drafts, and skip Dependabot PRs (T-155): GitHub runs dependabot-
    # triggered workflows in a restricted context that does NOT expose regular
    # org/repo Actions secrets, so the Anthropic credential is never present and
    # this gating job could only ever hard-fail. Dependency-only PRs change no
    # application code — semgrep, codeql, and dependency-review still cover them.
    # A skipped required check is treated as passing, so this unblocks the PR.
    # release-fast-pass: a bot-authored release-please PR changes only
    # version/changelog files (verified by release-please.yml before it arms
    # auto-merge) — skip; GitHub counts a skipped required check as satisfied.
    if: >-
      github.event.pull_request.draft == false && github.actor != 'dependabot[bot]' &&
      !(startsWith(github.head_ref, 'release-please--') &&
        github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preflight — Anthropic credential present (e2e-audit ci-gates-4)
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::No Anthropic credential — this GATING security review can never pass. Fix: gh secret set CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token', Pro/Max subscription — FREE, no metered spend) or gh secret set ANTHROPIC_API_KEY (metered). setup.sh and harness-doctor both check this."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Claude security review (OAuth — subscription, no metered spend)
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription OAuth token first (free); API key only as a fallback if
          # someone sets it. An empty secret resolves to unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet, not Opus — diff-scoped SAST doesn't need Opus, and this keeps
          # any future API-key fallback cheap. v1 takes model via claude_args.
          # FINDING-32 (live-e2e 2026-06-14): --max-turns 15 was too tight — the
          # multi-pass review (read diff → read surrounding code → form findings
          # → re-verify each → post) exhausted the budget on a multi-file PR, and
          # the action treats turn-exhaustion as exit 1, hard-failing the GATE on
          # a non-finding. Raise to 40 so the agent can finish; still bounded so a
          # runaway can't burn unbounded subscription turns.
          claude_args: "--model claude-sonnet-4-6 --max-turns 40"
          prompt: |
            You are the security agent (.claude/agents/quality/security.md).
            Perform a security audit of THIS PULL REQUEST'S DIFF ONLY — do not
            flag pre-existing issues outside the changed lines.

            Scope (OWASP LLM/web Top 10 + the constitution's guardrails):
            injection (SQL/command/path/template), authn/authz gaps, secret or
            credential exposure, SSRF, insecure deserialization, missing input
            validation, unsafe shell (eval, curl|sh, command interpolation,
            unquoted GitHub-expression interpolation into run: steps),
            permission/sandbox regressions, dependency risk.

            Multi-pass (re-verify to suppress false positives):
            1. Read the diff.
            2. Read the full surrounding code for each changed hunk.
            3. Form findings, severity-tagged (critical/high/medium/low/info).
            4. Re-verify each finding by re-reading the relevant path — drop
               anything you cannot substantiate at a concrete path:line.
            5. Post the surviving findings as inline PR review comments.

            FORMAT CONTRACT (machine-checked): every finding MUST cite
            `path:line`. End your summary with the exact line:
            `Security: re-verified <N> findings, suppressed <M> false positives.`

            Block the PR (--request-changes) if any critical or high remains.

      - name: Lint security review format (citations + marker)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          reviews=$(gh pr view "$PR_NUMBER" --json reviews -q '.reviews[].body' 2>/dev/null || true)
          [ -z "$reviews" ] && { echo "no review body yet — skipping format lint"; exit 0; }
          if ! echo "$reviews" | grep -qE 'Security: re-verified [0-9]+ findings'; then
            echo "::warning::Security review output lacks the re-verification marker — pass-2 not evidenced."
          fi
          if ! echo "$reviews" | grep -qE '[A-Za-z0-9_./-]+\.[a-z]+:[0-9]+'; then
            echo "::warning::Security review findings carry no path:line citations."
          fi
          echo "security review format lint done"

      - name: Gitleaks (CLI — no org licence; T-143)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          cfg=""; [ -f .gitleaks.toml ] && cfg="--config .gitleaks.toml"
          # shellcheck disable=SC2086 # cfg is a controlled two-token flag or empty; intentional word-split
          /tmp/gitleaks git --redact --exit-code 1 $cfg

      # dependency-review needs Dependency Graph (+ GHAS on private repos) — advisory
      # where the capability is absent (T-144); gitleaks + the LLM scan still gate.
      - name: Dependency review (advisory where Dependency Graph/GHAS is off; T-144)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
