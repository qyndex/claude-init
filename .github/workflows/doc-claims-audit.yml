name: Doc Claims Audit

# Fails the PR if any doc makes an enforcement claim ("enforced by X.sh",
# "blocked by Y.yml", ...) that names a gate which does not exist in the harness
# (Spec 001 AC-23). Keeps documentation honest about what is actually enforced.
# Static commands only — no event-payload interpolation — so it is not exposed
# to workflow injection.

on:
  pull_request:
    paths:
      - "docs/**"
      - "CLAUDE.md"
      - ".claude/CLAUDE.md"
      - ".claude/skills/**"
      - ".claude/scripts/**"
      - ".claude/hooks/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CLAUDE.md"
      - ".claude/CLAUDE.md"
      - ".claude/skills/**"

permissions:
  contents: read

jobs:
  doc-claims-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit documentation enforcement claims
        run: |
          bash .claude/scripts/audit-doc-claims.sh
