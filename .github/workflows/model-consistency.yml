name: Model Consistency

# Fails the PR if any agent's `model:` frontmatter contradicts the §V routing
# table in .claude/CLAUDE.md (Spec 001 AC-11). Uses only static commands — no
# ${{ github.event.* }} interpolation — so it is not exposed to workflow injection.

on:
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/CLAUDE.md"
  push:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".claude/CLAUDE.md"

permissions:
  contents: read

jobs:
  model-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent model assignments against §V
        run: |
          bash .claude/scripts/check-model-consistency.sh
