name: PR review (anti-slop triage)

# AC-36: anti-slop reviewer triage pass on every PR.
# The full review (claude-code-review + security) lives in claude-review.yml.
# This workflow runs the anti-slop-reviewer agent as a WARN-ONLY advisory pass
# for the first 30 days; after that it becomes a gating check.
#
# Agent: .claude/agents/quality/anti-slop-reviewer.md
# Triage classes: actionable-bug | actionable-docs | actionable-feature |
#                 duplicate | spam | generated-slop | security-sensitive | not-reproducible

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  anti-slop-triage:
    runs-on: ubuntu-latest
    # Advisory mode — never fail the PR during the first 30 days
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run anti-slop reviewer (triage pass)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          max_turns: 20
          agent: anti-slop-reviewer
          prompt: |
            Triage this PR as the anti-slop-reviewer agent
            (.claude/agents/quality/anti-slop-reviewer.md).
            Classify into exactly one of eight classes and post a single
            advisory comment. Do not request changes — comment only.
