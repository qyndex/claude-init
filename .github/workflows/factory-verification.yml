name: Factory Verification
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: factory-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  produce-verification:
    if: >-
      vars.FACTORY_PRODUCERS_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out protected runtime only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start exact-candidate producer check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 .claude/scripts/factory-producer-check.py --role verification \
            --repository "$GITHUB_REPOSITORY" --pr "$PR" --run-id "$GITHUB_RUN_ID" --state /tmp/producer-check.json
      - name: Independently produce candidate proof
        id: proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 .claude/scripts/factory-producer.py --role verification --policy factory/policy.json \
            --pr "$PR" --run-id "$GITHUB_RUN_ID" --check-state /tmp/producer-check.json --output producer-output
      - name: Preserve authenticated proof bytes
        id: upload
        if: always() && steps.proof.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-verification-pr-${{ github.event.pull_request.number }}
          path: producer-output/
          if-no-files-found: error
          retention-days: 90
      - name: Complete exact-candidate check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PROOF: ${{ steps.proof.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          verdict=failure
          if [ "$PROOF" = success ] && [ "$UPLOAD" = success ]; then verdict=success; fi
          python3 .claude/scripts/factory-producer-check.py --role verification \
            --repository "$GITHUB_REPOSITORY" --pr "$PR" --run-id "$GITHUB_RUN_ID" \
            --state /tmp/producer-check.json --finish "$verdict"
