name: Factory Reporting Queue Monitor
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      verification_drill:
        description: Send a labelled queue verification drill, not an outage
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: factory-reporting-queue-${{ github.repository }}
  cancel-in-progress: false
jobs:
  monitor:
    if: >-
      vars.FACTORY_REPORTING_ENABLED == 'true' &&
      vars.FACTORY_REPORTING_PROFILE == 'github-hosted' &&
      vars.FACTORY_REPORTING_QUEUE_ENABLED == 'true' &&
      github.server_url == 'https://github.com' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: factory-reporting
    env:
      FACTORY_REPORTING_APP_WRITER_ENABLED: ${{ vars.FACTORY_REPORTING_APP_WRITER_ENABLED || 'false' }}
      FACTORY_REPORTING_APP_ID: ${{ vars.FACTORY_REPORTING_APP_ID }}
      FACTORY_REPORTING_STATE_REPOSITORY: ${{ vars.FACTORY_REPORTING_STATE_REPOSITORY || github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint repository-scoped reporting writer token
        id: reporting_app
        if: env.FACTORY_REPORTING_APP_WRITER_ENABLED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.FACTORY_REPORTING_APP_ID }}
          private-key: ${{ secrets.FACTORY_REPORTING_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-administration: read
      - name: Validate selected reporting credentials
        if: env.FACTORY_REPORTING_APP_WRITER_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_REPORTING_APP_TOKEN: ${{ steps.reporting_app.outputs.token }}
        run: |
          python3 - <<'PYWRITER'
          import importlib.util,os
          spec=importlib.util.spec_from_file_location('reporting_transport','.claude/scripts/factory-reporting-transport.py')
          transport=importlib.util.module_from_spec(spec);spec.loader.exec_module(transport)
          transport.create_api(os.environ)
          PYWRITER
      - name: Observe and reconcile protected queue notifications
        env:
          FACTORY_REPORTING_ENABLED: ${{ vars.FACTORY_REPORTING_ENABLED }}
          FACTORY_REPORTING_PROFILE: ${{ vars.FACTORY_REPORTING_PROFILE }}
          FACTORY_REPORTING_QUEUE_ENABLED: ${{ vars.FACTORY_REPORTING_QUEUE_ENABLED }}
          FACTORY_REPORTING_QUEUE_GRACE_MINUTES: ${{ vars.FACTORY_REPORTING_QUEUE_GRACE_MINUTES }}
          FACTORY_REPORTING_QUEUE_BOOTSTRAP_SHA: ${{ vars.FACTORY_REPORTING_QUEUE_BOOTSTRAP_SHA }}
          FACTORY_REPORTING_QUEUE_INITIALIZE: ${{ vars.FACTORY_REPORTING_QUEUE_INITIALIZE }}
          FACTORY_REPORTING_ATTACHMENTS_ENABLED: ${{ vars.FACTORY_REPORTING_ATTACHMENTS_ENABLED }}
          FACTORY_REPORTING_CHANNEL: ${{ vars.FACTORY_REPORTING_CHANNEL }}
          FACTORY_REPORTING_TEAM_ID: ${{ vars.FACTORY_REPORTING_TEAM_ID }}
          FACTORY_REPORTING_START: ${{ vars.FACTORY_REPORTING_START }}
          FACTORY_REPORTING_BRANCH: ${{ github.event.repository.default_branch }}
          FACTORY_REPORTING_STATE_REPOSITORY: ${{ vars.FACTORY_REPORTING_STATE_REPOSITORY || github.repository }}
          FACTORY_REPORTING_STATE_BRANCH: ${{ vars.FACTORY_REPORTING_STATE_BRANCH }}
          FACTORY_REPORTING_POLICY_APPROVALS: ${{ vars.FACTORY_REPORTING_POLICY_APPROVALS }}
          GH_TOKEN: ${{ github.token }}
          FACTORY_REPORTING_STATE_TOKEN: ${{ secrets.FACTORY_REPORTING_STATE_TOKEN }}
          FACTORY_REPORTING_APP_TOKEN: ${{ steps.reporting_app.outputs.token }}
          FACTORY_SLACK_BOT_TOKEN: ${{ secrets.FACTORY_SLACK_BOT_TOKEN }}
          VERIFICATION_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_drill && 'true' || 'false' }}
        run: |
          check_drill_result() {
            python3 - "$1" "$2" <<'PYRESULT'
          import json,sys
          def pairs(items):
              result={}
              for key,value in items:
                  if key in result: raise ValueError('Duplicate queue drill result field')
                  result[key]=value
              return result
          with open(sys.argv[1],'rb') as source: raw=source.read(4097)
          if len(raw)>4096: raise ValueError('Queue drill result exceeds bound')
          result=json.loads(raw,object_pairs_hook=pairs)
          if (type(result) is not dict or set(result)!={'notifications','reconciled'} or
              any(type(result[key]) is not int or not 0<=result[key]<=1000 for key in result) or
              result['notifications']!=int(sys.argv[2])):
              raise ValueError('Queue drill result differs; preserve intent before retry')
          print(json.dumps(result,sort_keys=True))
          PYRESULT
          }
          if [ "$VERIFICATION_DRILL" = "true" ]; then
            umask 077
            python3 .claude/scripts/factory-reporting-queue.py --drill > "$RUNNER_TEMP/factory-queue-first.json"
            check_drill_result "$RUNNER_TEMP/factory-queue-first.json" 1
            python3 .claude/scripts/factory-reporting-queue.py --drill > "$RUNNER_TEMP/factory-queue-second.json"
            check_drill_result "$RUNNER_TEMP/factory-queue-second.json" 0
          else
            python3 .claude/scripts/factory-reporting-queue.py
          fi
