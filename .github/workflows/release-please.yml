name: Release Please

# Conventional Commits -> auto-generated CHANGELOG and release PRs.
# https://github.com/googleapis/release-please-action
#
# Release PR creation is separate from factory merge authority. Release candidates
# request the protected coordinator; no release-fast-pass can grant eligibility.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # cut the tag/release after a bot-merged release PR
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4 # for assert-release-only-diff.sh

      - name: Verify release PR scope and request factory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json=$(gh pr list --repo "$REPO" --state open \
                      --json number,headRefName,author \
                      --jq '[.[] | select(.headRefName | startswith("release-please--"))
                                 | select(.author.login == "app/github-actions" or .author.login == "github-actions")]
                            | .[0]')
          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "no open release-please PR — nothing to do"
            exit 0
          fi
          pr=$(printf '%s' "$pr_json" | jq -r '.number')
          branch=$(printf '%s' "$pr_json" | jq -r '.headRefName')

          # Fail-safe the skip conditions rely on: never arm a release PR
          # whose diff strays outside the version/changelog allowlist.
          RELEASE_BRANCH="$branch" bash .claude/scripts/assert-release-only-diff.sh

          gh workflow run factory-merge.yml --repo "$REPO" -f "pr=$pr" -f mode=merge
          echo "release PR #$pr submitted to protected factory eligibility"
