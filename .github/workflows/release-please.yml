name: Release Please

# Conventional Commits -> auto-generated CHANGELOG and release PRs.
# https://github.com/googleapis/release-please-action

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
