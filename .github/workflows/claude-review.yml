name: Claude PR Review

# Exact-head ordinary source review using pinned Sonnet 5.5 and subscription OAuth.
# Tool-free, bounded stdin; structured artifacts are not protected factory receipts.
# No Claude GitHub App integration, API fallback or comment posting.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

# e2e-audit ci-gates-6: one LLM review per PR head — a push storm must not
# multiply gating-review spend.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts + Dependabot PRs (T-155): dependabot-triggered runs don't get
    # regular org/repo Actions secrets, so the Anthropic credential is absent and
    # this gating job could only hard-fail. Dependency-only PRs change no app
    # code (semgrep/codeql/dependency-review still cover them). A skipped
    # required check counts as passing, unblocking the PR.
    # release-fast-pass: a bot-authored release-please PR changes only
    # version/changelog files (verified by release-please.yml before it arms
    # auto-merge) — skip; GitHub counts a skipped required check as satisfied.
    if: >-
      github.event.pull_request.draft == false && github.actor != 'dependabot[bot]' &&
      !(startsWith(github.head_ref, 'release-please--') &&
        github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact-head review context and validator
        id: prepare_review
        run: |
          mkdir "$RUNNER_TEMP/ordinary-review-runtime"
          cp .claude/scripts/run-claude-review.py .claude/scripts/retain-claude-review.py .claude/scripts/factory-bounded-process.py "$RUNNER_TEMP/ordinary-review-runtime/"
          python3 -I .claude/scripts/prepare-claude-review.py

      - name: Set up pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install pinned subscription reviewer
        id: install_review
        run: npm install --prefix "$RUNNER_TEMP/ordinary-review-cli" @anthropic-ai/claude-code@2.1.295

      - name: Run and retain bounded tool-free review
        id: claude_review
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_PREPARE_OUTCOME: ${{ steps.prepare_review.outcome }}
          REVIEW_INSTALL_OUTCOME: ${{ steps.install_review.outcome }}
        run: |
          if [ ! -f "$RUNNER_TEMP/ordinary-review-runtime/run-claude-review.py" ]; then
            mkdir "$RUNNER_TEMP/retained-code-review"
            printf '%s\n' '{"schema_version":1,"role":"code","status":"blocked","reason":"runtime-unavailable"}' > "$RUNNER_TEMP/retained-code-review/review.json"
            exit 1
          fi
          if REVIEW_NODE="$(command -v node)"; then :; else REVIEW_NODE=""; fi
          REVIEW_EXECUTABLE="$RUNNER_TEMP/ordinary-review-cli/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs"
          export REVIEW_NODE REVIEW_EXECUTABLE
          python3 -I "$RUNNER_TEMP/ordinary-review-runtime/run-claude-review.py" --role code --output "$RUNNER_TEMP/retained-code-review"

      - name: Preserve code review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: claude-code-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-code-review/review.json
          if-no-files-found: error
          retention-days: 90
