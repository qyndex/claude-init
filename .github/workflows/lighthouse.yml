name: Lighthouse CI

# Frontend perf budget enforcement. Runs on every PR. Compares against historical baselines.
# Stores results in .lighthouseci/ artifact for /perf-trend.

on:
  deployment_status:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: 'package.json' }

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          else npm ci
          fi

      - name: Run Lighthouse CI
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npm install -g @lhci/cli
          if [ -n "$PREVIEW_URL" ]; then
            lhci collect --url "$PREVIEW_URL" --numberOfRuns 3
          else
            lhci collect --url http://localhost:3000 --numberOfRuns 3 --startServerCommand 'npm run dev'
          fi
          lhci assert --preset=lighthouse:recommended || true
          lhci upload --target=temporary-public-storage

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci/
          retention-days: 90
