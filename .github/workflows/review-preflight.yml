name: Review credential diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  credential-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Probe review credential without candidate code or tools
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd "$(mktemp -d)"
          npx --yes @anthropic-ai/claude-code --setting-sources '' --tools '' \
            --model claude-sonnet-4-6 --max-turns 1 --output-format json \
            -p 'Reply with exactly OK.'
