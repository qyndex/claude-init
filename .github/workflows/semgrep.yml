name: Semgrep

# Lighter / faster SAST companion to CodeQL.
# Catches things CodeQL takes hours to find, in ~1 minute.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep (CI ruleset)
        run: |
          # Produce SARIF for upload and validated severity enforcement.
          # The "Fail on high/critical" step is the gate and is GHAS-
          # independent; --error here would ALSO fail on low/info matches, so we
          # drop it and let check-sarif.sh decide severity. Scanner errors still fail.
          semgrep --config=p/ci --config=p/owasp-top-ten --config=p/secrets \
                  --sarif --output=semgrep.sarif \
                  .

      # FINDING-27 (live-e2e 2026-06-13): upload-sarif posts to GitHub Code
      # Scanning, which needs Code Security / GHAS enabled. On a repo without it
      # (e.g. a private Team-plan repo) this step hard-exits "Code Security must
      # be enabled" and sank the whole daily-batch. The SARIF upload is a UI
      # nicety, NOT the gate — make it advisory; the jq step below is the gate.
      - name: Upload SARIF (advisory — needs Code Security/GHAS)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on high/critical
        run: |
          bash .claude/scripts/check-sarif.sh semgrep.sarif
