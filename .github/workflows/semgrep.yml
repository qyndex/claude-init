name: Semgrep

# Lighter / faster SAST companion to CodeQL.
# Catches things CodeQL takes hours to find, in ~1 minute.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep (CI ruleset)
        run: |
          # Produce SARIF for the upload + the jq gate below. The dedicated
          # "Fail on high/critical" step (jq) is the REAL gate and is GHAS-
          # independent; --error here would ALSO fail on low/info matches, so we
          # drop it and let the jq step decide severity (FINDING-27).
          semgrep --config=p/ci --config=p/owasp-top-ten --config=p/secrets \
                  --sarif --output=semgrep.sarif \
                  . || true

      # FINDING-27 (live-e2e 2026-06-13): upload-sarif posts to GitHub Code
      # Scanning, which needs Code Security / GHAS enabled. On a repo without it
      # (e.g. a private Team-plan repo) this step hard-exits "Code Security must
      # be enabled" and sank the whole daily-batch. The SARIF upload is a UI
      # nicety, NOT the gate — make it advisory; the jq step below is the gate.
      - name: Upload SARIF (advisory — needs Code Security/GHAS)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on high/critical
        run: |
          if [ -f semgrep.sarif ]; then
            jq '[.runs[].results[] | select(.level == "error" or .properties."security-severity" >= "7.0")] | length' semgrep.sarif | \
              xargs -I{} sh -c 'if [ "{}" -gt 0 ]; then echo "{} high/critical findings"; exit 1; else echo "clean"; fi'
          fi
