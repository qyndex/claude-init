name: Semgrep

# Lighter / faster SAST companion to CodeQL.
# Catches things CodeQL takes hours to find, in ~1 minute.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep (CI ruleset)
        run: |
          # Round 8 E: dropped `|| true` so semgrep actually fails the job.
          # --error flag exits non-zero on any rule match.
          semgrep --config=p/ci --config=p/owasp-top-ten --config=p/secrets \
                  --error \
                  --sarif --output=semgrep.sarif \
                  .

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on high/critical
        run: |
          if [ -f semgrep.sarif ]; then
            jq '[.runs[].results[] | select(.level == "error" or .properties."security-severity" >= "7.0")] | length' semgrep.sarif | \
              xargs -I{} sh -c 'if [ "{}" -gt 0 ]; then echo "{} high/critical findings"; exit 1; else echo "clean"; fi'
          fi
