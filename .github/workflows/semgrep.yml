name: Semgrep

# Lighter / faster SAST companion to CodeQL.
# Catches things CodeQL takes hours to find, in ~1 minute.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    if: vars.FACTORY_SECURITY_AUDIT_ENABLED != 'true' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep (CI ruleset)
        run: |
          # Produce SARIF for upload and validated severity enforcement.
          # The "Fail on high/critical" step is the gate and is GHAS-
          # independent; --error here would ALSO fail on low/info matches, so we
          # drop it and let check-sarif.sh decide severity. Scanner errors still fail.
          semgrep --config=p/ci --config=p/owasp-top-ten --config=p/secrets \
                  --sarif --output=semgrep.sarif \
                  .

      # FINDING-27 (live-e2e 2026-06-13): upload-sarif posts to GitHub Code
      # Scanning, which needs Code Security / GHAS enabled. On a repo without it
      # (e.g. a private Team-plan repo) this step hard-exits "Code Security must
      # be enabled" and sank the whole daily-batch. The SARIF upload is a UI
      # nicety, NOT the gate — make it advisory; the jq step below is the gate.
      - name: Upload SARIF (advisory — needs Code Security/GHAS)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on high/critical
        run: |
          bash .claude/scripts/check-sarif.sh semgrep.sarif

  # Fixed environment is entered only for opted-in main runs. Configure
  # its main-only restrictions and hash scope before enabling; no App keys enter.
  semgrep-audit:
    if: vars.FACTORY_SECURITY_AUDIT_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: factory-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify trusted audit source
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Audit policy requires main" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "Audit source SHA differs" >&2; exit 1; }
          echo "Audit source SHA: $GITHUB_SHA"

      - name: Run Semgrep (CI ruleset)
        run: |
          semgrep --config=p/ci --config=p/owasp-top-ten --config=p/secrets \
                  --sarif --output=semgrep.sarif .

      - name: Retain raw SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-security-raw-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 90

      - name: Upload SARIF (advisory — needs Code Security/GHAS)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Enforce authenticated audit policy
        env:
          EXPECTED_REGISTRY_SHA256: ${{ vars.FACTORY_SECURITY_AUDIT_POLICY_SHA256 }}
        run: |
          bash .claude/scripts/check-sarif.sh semgrep.sarif \
            --audit-policy "$GITHUB_WORKSPACE/.claude/security-audit-exceptions.json" \
            --expected-registry-sha256 "$EXPECTED_REGISTRY_SHA256" \
            --source-root "$GITHUB_WORKSPACE"
