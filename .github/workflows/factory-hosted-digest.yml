name: Factory Hosted Delivery Digest
on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: factory-reporting-${{ github.repository }}
  cancel-in-progress: false
jobs:
  report:
    if: >-
      vars.FACTORY_REPORTING_ENABLED == 'true' &&
      vars.FACTORY_REPORTING_PROFILE == 'github-hosted' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: factory-reporting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare explicit hosted configuration
        env:
          FACTORY_REPORTING_CHANNEL: ${{ vars.FACTORY_REPORTING_CHANNEL }}
          FACTORY_REPORTING_TEAM_ID: ${{ vars.FACTORY_REPORTING_TEAM_ID }}
          FACTORY_REPORTING_START: ${{ vars.FACTORY_REPORTING_START }}
          FACTORY_REPORTING_BRANCH: ${{ github.event.repository.default_branch }}
          FACTORY_REPORTING_STATE_REPOSITORY: ${{ vars.FACTORY_REPORTING_STATE_REPOSITORY }}
          FACTORY_REPORTING_STATE_BRANCH: ${{ vars.FACTORY_REPORTING_STATE_BRANCH }}
          FACTORY_REPORTING_BOOTSTRAP_SHA: ${{ vars.FACTORY_REPORTING_BOOTSTRAP_SHA }}
        run: |
          umask 077
          python3 - <<'PYCONFIG'
          import json,os
          from pathlib import Path
          config={'enabled':True,'repository':os.environ['GITHUB_REPOSITORY'],
                  'state_repository':os.environ['FACTORY_REPORTING_STATE_REPOSITORY'] or os.environ['GITHUB_REPOSITORY'],
                  'branch':os.environ['FACTORY_REPORTING_BRANCH'],
                  'destination':os.environ['FACTORY_REPORTING_CHANNEL'],'team_id':os.environ['FACTORY_REPORTING_TEAM_ID'],
                  'start':os.environ['FACTORY_REPORTING_START'],'state_branch':os.environ['FACTORY_REPORTING_STATE_BRANCH'],
                  'bootstrap_sha':os.environ['FACTORY_REPORTING_BOOTSTRAP_SHA']}
          Path(os.environ['RUNNER_TEMP'],'factory-hosted-digest.json').write_text(json.dumps(config))
          PYCONFIG
      - name: Verify Slack identity and history before delivery
        env:
          FACTORY_SLACK_BOT_TOKEN: ${{ secrets.FACTORY_SLACK_BOT_TOKEN }}
        run: |
          python3 - <<'PYPREFLIGHT'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('transport','.claude/scripts/factory-slack-digest.py')
          transport=importlib.util.module_from_spec(spec);spec.loader.exec_module(transport)
          config=json.loads(Path(os.environ['RUNNER_TEMP'],'factory-hosted-digest.json').read_text())
          client=transport.SlackHTTP()
          transport.preflight(client,config['team_id'],config['destination'])
          print('Slack workspace, bot and channel-history preflight passed.')
          PYPREFLIGHT
      - name: Deliver with authoritative branch checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_REPORTING_STATE_TOKEN: ${{ secrets.FACTORY_REPORTING_STATE_TOKEN }}
          FACTORY_SLACK_BOT_TOKEN: ${{ secrets.FACTORY_SLACK_BOT_TOKEN }}
        run: |
          umask 077
          python3 .claude/scripts/factory-git-state.py --config "$RUNNER_TEMP/factory-hosted-digest.json"
