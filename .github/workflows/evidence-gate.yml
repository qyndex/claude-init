name: Evidence gate

# Round 10 C. Required check. A PR cannot merge unless its body contains a
# complete evidence bundle with every acceptance criterion proven, smoke green,
# and verdict PASS. The operator's trust guarantee.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence-gate:
    # release-fast-pass: a bot-authored release-please PR changes only
    # version/changelog files (verified by release-please.yml before it arms
    # auto-merge) — skip; GitHub counts a skipped required check as satisfied.
    if: >-
      !(startsWith(github.head_ref, 'release-please--') &&
        github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gap-audit G57: the documented docs-only escape hatch now actually works.
      # A committed verify/<date>/no-ac.json is honored ONLY when the PR diff
      # touches exclusively documentation-class paths.
      - name: Docs-only / harness-maintenance escape hatch (no-ac.json — G57)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50 >/dev/null 2>&1 || true
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          echo "$changed" > /tmp/pr-changed-files.txt
          noac=$(echo "$changed" | grep -E '^verify/.*no-ac\.json$' | head -1)
          if [ -n "$noac" ]; then
            # The escape hatch has TWO scopes, both opt-in via a committed no-ac.json.
            # 1) docs-only: the PR touches ONLY documentation-class paths.
            # 2) harness-maintenance: the PR touches ONLY harness-internal paths
            #    (.claude/, .github/) + docs — never application source. This exists
            #    because a scripts/hooks/workflow bugfix has no spec with a
            #    browser-testable AC, so the AC-proof path can't apply; without this,
            #    every harness-maintenance PR must be admin-bypassed (PR #13, #14).
            #
            # A PR touching ANY app-source surface (src/ app/ web/ lib/ pkg/ cmd/
            # internal/ api/ services/ components/ etc.) is NEVER eligible — those
            # still require full evidence, regardless of no-ac.json.
            kind=$(jq -r '.kind // "docs-only"' "$noac" 2>/dev/null || echo "docs-only")

            # App-source surfaces that ALWAYS demand evidence (deny-list, not allow-list,
            # so a new top-level app dir can't silently slip through the maintenance hatch).
            appsrc=$(echo "$changed" | grep -vE '^(docs/|specs/|plans/|tasks/|verify/|README|CHANGELOG|\.claude/|\.github/|\.mcp\.json$|\.gitignore$|\.gitleaks\.toml$|\.shellcheckrc$|\.editorconfig$|codecov\.yml$|commitlint\.config\.mjs$|.*\.md$)' || true)

            if [ "$kind" = "harness-maintenance" ]; then
              if [ -z "$appsrc" ]; then
                echo "harness-maintenance PR with $noac — only harness-internal/docs paths touched; evidence gate satisfied by maintenance escape hatch."
                echo "$changed" | grep -E '^(\.claude/|\.github/)' | sed 's/^/  maintains: /' | head -20
                echo "docs_only=1" >> "$GITHUB_ENV"
              else
                echo "::error::no-ac.json kind=harness-maintenance but PR touches application source — those need full evidence:"; echo "$appsrc"
                exit 1
              fi
            else
              nondocs=$(echo "$changed" | grep -vE '^(docs/|specs/|plans/|tasks/|verify/|README|CHANGELOG|.*\.md$)' || true)
              if [ -z "$nondocs" ]; then
                echo "docs-only PR with $noac — evidence gate satisfied by escape hatch"
                echo "docs_only=1" >> "$GITHUB_ENV"
              else
                echo "::error::no-ac.json present but PR touches non-docs paths (use kind=harness-maintenance if these are .claude/.github maintenance):"; echo "$nondocs"
                exit 1
              fi
            fi
          fi

      - name: Assert PR body has a complete evidence bundle
        if: env.docs_only != '1'
        run: |
          body=$(gh pr view "$PR_NUMBER" --json body -q .body)
          if ! echo "$body" | grep -q "## Evidence Bundle"; then
            echo "::error::PR body has no Evidence Bundle. Run collect-evidence.sh and embed pr-body.md."
            exit 1
          fi
          if echo "$body" | grep -q "UNPROVEN"; then
            echo "::error::PR has UNPROVEN acceptance criteria. Every AC needs a passing tagged test."
            exit 1
          fi
          if ! echo "$body" | grep -qE "Verdict.*PASS"; then
            echo "::error::Evidence bundle verdict is not PASS."
            exit 1
          fi
          echo "Evidence bundle present, all ACs proven, verdict PASS."

      - name: Re-assert from committed evidence.json (bound to PR — G53)
        if: env.docs_only != '1'
        run: |
          # G53: the bundle must RIDE IN this PR, not merely exist in the tree —
          # stale or wrong-branch evidence is rejected.
          ev=$(grep -E '^verify/.*/evidence\.json$' /tmp/pr-changed-files.txt | sort -r | head -1)
          if [ -z "$ev" ]; then
            echo "::error::No evidence.json in this PR's diff — a bundle already in the tree proves an older change, not this one. Run collect-evidence.sh on this branch (or commit verify/<date>/no-ac.json for docs-only PRs)."
            exit 1
          fi
          unproven=$(jq -r '.ac_unproven | length' "$ev")
          smoke=$(jq -r '.smoke_exit_max' "$ev")
          verdict=$(jq -r '.verdict' "$ev")
          echo "evidence.json: unproven=$unproven smoke_exit=$smoke verdict=$verdict"
          [ "$unproven" -eq 0 ] || { echo "::error::$unproven unproven ACs"; exit 1; }
          [ "$smoke" -eq 0 ] || { echo "::error::smoke exit $smoke"; exit 1; }
          [ "$verdict" = "PASS" ] || { echo "::error::verdict $verdict"; exit 1; }

          # G53: commit binding — the attested commit must be an ancestor of head
          ev_commit=$(jq -r '.commit // "unknown"' "$ev")
          if [ "$ev_commit" = "unknown" ] || [ -z "$ev_commit" ]; then
            echo "::error::evidence.json carries no commit binding — regenerate with the current collect-evidence.sh (G53)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$ev_commit" HEAD 2>/dev/null; then
            echo "::error::evidence.json attests commit $ev_commit which is not an ancestor of this PR's head — stale or foreign evidence (G53)."
            exit 1
          fi

          # G53: spec binding — if the PR touches a spec, the bundle must be for it
          ev_spec=$(jq -r '.spec // empty' "$ev")
          touched_spec=$(grep -E '^specs/active/[0-9]+' /tmp/pr-changed-files.txt | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "$touched_spec" ] && [ -n "$ev_spec" ] && [ "$ev_spec" != "$touched_spec" ]; then
            echo "::error::PR touches spec $touched_spec but evidence.json attests spec $ev_spec (G53)."
            exit 1
          fi
          echo "ev_path=$ev" >> "$GITHUB_ENV"

      # e2e-audit e2e-rig-2/ci-gates-3: install the project toolchain + deps
      # (and BYO services / allowlisted env) BEFORE re-executing proof — a
      # toolchain-less runner fails with "command not found" and mis-attributes
      # it as evidence divergence.
      - name: Setup stack for re-execution
        if: env.docs_only != '1'
        uses: ./.github/actions/setup-stack

      # Gap-audit G49: don't trust the agent-committed attestation — REGENERATE
      # the proof against the checked-out head. The smoke command evidence.json
      # attests (verify.sh) is re-run here; if the journey rig exists, the
      # journey + spec-match are re-run too. Divergence from the committed
      # claims fails the gate.
      - name: Re-execute proof against head (G49)
        if: env.docs_only != '1'
        run: |
          [ -n "${ev_path:-}" ] || { echo "no evidence.json (docs-only path) — skip re-execution"; exit 0; }
          spec=$(jq -r '.spec // empty' "$ev_path")

          echo "→ re-running smoke (bash .claude/scripts/verify.sh)"
          # e2e-audit tdd-loop-2: SKIP_TDD_LEDGER removed — red/green ledger logs
          # are committed (P2.1 gitignore negation), so CI CAN and MUST enforce
          # the ledger. Story-map + integ-cov remain skipped here (covered by
          # their own gates) — explicit, logged:
          echo "VERIFY_CI path: SKIP_STORY_MAP=1 SKIP_INTEG_COV=1 (gates run elsewhere); TDD ledger ENFORCED"
          if ! VERIFY_CI=1 SKIP_STORY_MAP=1 SKIP_INTEG_COV=1 bash .claude/scripts/verify.sh; then
            echo "::error::Smoke re-execution FAILED on head, but committed evidence.json claims smoke_exit_max=0 — evidence diverges from reality (G49)."
            exit 1
          fi

          if [ -n "$spec" ] && [ -f playwright.evidence.config.ts ] && [ -d "e2e/$spec" ]; then
            echo "→ re-running journey + spec-match for spec $spec"
            # e2e-audit ci-gates-3: install un-muted — a browser-install failure
            # must surface as a toolchain error, not as "evidence diverges".
            npx playwright install --with-deps chromium
            VERIFY_FEATURE="$spec" npx playwright test --config playwright.evidence.config.ts "e2e/$spec" || {
              echo "::error::Journey re-execution failed for spec $spec — committed evidence is stale (G49)."; exit 1; }
            results=$(find verify -name results.json -newer "$ev_path" 2>/dev/null | sort -r | head -1)
            if [ -n "$results" ]; then
              bash .claude/scripts/spec-match.sh "$spec" "$results" || {
                echo "::error::spec-match divergence: an AC the evidence claims proven did not re-prove on head (G49)."; exit 1; }
            fi
          else
            echo "no playwright rig / e2e/$spec — smoke re-execution is the proof for this PR"
          fi
          echo "✓ proof regenerated on head; committed evidence is consistent"

      # e2e-audit e2e-rig-5: a FAILED G49 re-execution previously discarded its
      # trace.zip/video with the runner — the diagnosis went down with the ship.
      # Upload verify/ unconditionally so a red gate leaves something to open.
      - name: Upload verify artifacts (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-evidence-${{ github.event.pull_request.number }}
          path: |
            verify/**
            !verify/**/*.webm.tmp
          retention-days: 14
          if-no-files-found: ignore
