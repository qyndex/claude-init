name: Auto-merge (factory request)
on:
  pull_request:
    types: [opened, reopened, labeled, ready_for_review, synchronize]
permissions:
  contents: read
  actions: write
concurrency:
  group: factory-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  request:
    if: >-
      github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'auto-merge-ok') ||
       startsWith(github.event.pull_request.head.ref, 'factory/spec-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Request protected factory evaluation
        run: gh workflow run factory-merge.yml --repo "$REPO" -f "pr=$PR" -f mode=merge
